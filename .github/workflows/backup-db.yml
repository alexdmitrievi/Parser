name: Backup Database

on:
  schedule:
    - cron: "0 2 * * *"  # ежедневно в 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tender-parser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Ключ пробрасывается под всеми тремя именами: shared/config.supabase_key()
          # берёт первое непустое. До коммита ffcc846 workflow использовали
          # SUPABASE_KEY, после — SUPABASE_SERVICE_ROLE_KEY, который в репозитории
          # так и не завели. Так работает при любом из заведённых секретов.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BACKUP_DIR: /tmp/backups
        run: python scripts/backup_db.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: /tmp/backups/*.zip
          retention-days: 30
