name: Send Notifications

on:
  schedule:
    - cron: "30 */3 * * *"  # каждые 3 часа (смещение на 30 мин от парсинга)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: tender-parser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send Telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Ключ пробрасывается под всеми тремя именами: shared/config.supabase_key()
          # берёт первое непустое. До коммита ffcc846 workflow использовали
          # SUPABASE_KEY, после — SUPABASE_SERVICE_ROLE_KEY, который в репозитории
          # так и не завели. Так работает при любом из заведённых секретов.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Потолок сообщений на подписку за прогон. Пусто — берётся значение
          # по умолчанию (10). Настраивается без правки кода:
          # Settings → Secrets and variables → Actions → Variables.
          # На первых прогонах после долгой паузы имеет смысл поставить 1-3.
          MAX_NOTIFICATIONS_PER_SUBSCRIPTION: ${{ vars.MAX_NOTIFICATIONS_PER_SUBSCRIPTION }}
        run: |
          python scripts/run_notifier.py
