name: Parse Funding Programs

on:
  schedule:
    - cron: "0 */6 * * *"  # каждые 6 часов
  workflow_dispatch:

jobs:
  parse-funding:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tender-parser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-parser.txt

      - name: Parse MSP funding programs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Ключ пробрасывается под всеми тремя именами: shared/config.supabase_key()
          # берёт первое непустое. До коммита ffcc846 workflow использовали
          # SUPABASE_KEY, после — SUPABASE_SERVICE_ROLE_KEY, который в репозитории
          # так и не завели. Так работает при любом из заведённых секретов.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python scripts/run_funding.py
