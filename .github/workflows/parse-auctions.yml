name: Parse Auctions

on:
  schedule:
    - cron: "0 */4 * * *"  # каждые 4 часа
  workflow_dispatch:

jobs:
  parse-auctions:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: tender-parser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Источник torgi_gov_pw работает через Playwright — без него
          # он молча возвращает ноль лотов на каждом прогоне.
          pip install -r requirements-playwright.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Parse bankruptcy / government auctions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/run_parser.py --source auctions
