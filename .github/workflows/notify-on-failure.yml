name: Notify on Failure

on:
  workflow_run:
    workflows:
      # Имена должны совпадать с полем name внутри workflow, иначе триггер
      # молча не срабатывает. "Notify" здесь был опечаткой: workflow
      # называется "Send Notifications".
      - "Parse Tenders"
      - "Parse Auctions"
      - "Parse Playwright Platforms"
      - "Parse Funding Programs"
      - "Parse Leads (China importers)"
      - "Send Notifications"
      - "Update Tender Statuses"
      - "Backup Database"
    types:
      - completed

jobs:
  alert:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    defaults:
      run:
        working-directory: tender-parser

    steps:
      - name: Report failure
        run: |
          echo "Workflow ${{ github.event.workflow_run.name }} FAILED"
          echo "Run URL: ${{ github.event.workflow_run.html_url }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
