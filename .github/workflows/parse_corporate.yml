name: Parse Corporate Platforms

on:
  schedule:
    - cron: '0 4,16 * * *'  # Дважды в день
  workflow_dispatch: {}

defaults:
  run:
    working-directory: tender-parser

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tender-parser/requirements-parser.txt
      - run: pip install -r requirements-parser.txt

      - name: Parse Corporate (Gazprom, Rosatom, Rosneft, Lukoil, Nornickel, MTS, SberB2B)
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/run_parser.py --source corporate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
