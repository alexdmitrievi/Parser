# Бизнес-фильтры мониторинга закупок ООО «Подряд ПРО».
#
# Файл перечитывается на каждом цикле мониторинга (раз в 120 минут) —
# правки применяются без рестарта сервиса.
#
# Логика: закупка проходит, если
#   (регион ∧ закон ∧ НМЦК в диапазоне)
#   ∧ (совпал ОКПД2-префикс ∨ ключевое слово в наименовании)
#   ∧ (нет стоп-слов в наименовании)

regions: ["Омская область", "Новосибирская область"]
laws: ["44-ФЗ", "223-ФЗ"]
nmck:
  min: 300000
  max: 10000000
okpd2_prefixes: ["43.11", "43.12", "43.29", "43.31", "43.32", "43.33", "43.34", "43.39", "19.20.28", "46.71"]
keywords: ["расчистка территории", "валка деревьев", "снос", "демонтаж",
           "благоустройство", "текущий ремонт", "ремонт помещений",
           "отделочные работы", "печное топливо", "нефтепродукты"]
stop_words: ["проектирование", "ПИР", "капитальный ремонт многоквартирных"]
