# Цели обхода 2ГИС (РФ + Казахстан).
#
# code рубрик и городов берутся из данных parser-2gis:
#   data/rubrics.json (рубрики) и data/cities.json (города).
# Файл перечитывается на каждом запуске — правки применяются без изменения кода.
#
# Ниша Батча 2: промышленное оборудование (станки, комплектующие).
# Рубрики 2ГИС:
#   614  — Металлообрабатывающее оборудование (станки)
#   112  — Промышленное оборудование
#   8743 — Оборудование для автоматизации промышленных предприятий

profile: industrial_equipment

targets:
  - country: Russia
    city_code: moscow
    domain: ru
    rubrics:
      - {code: "614", name: "Металлообрабатывающее оборудование"}
      - {code: "112", name: "Промышленное оборудование"}
      - {code: "8743", name: "Оборудование для автоматизации промышленных предприятий"}

