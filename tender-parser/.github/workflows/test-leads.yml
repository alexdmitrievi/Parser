name: Tests (leads)

# Отдельный workflow, потому что домену leads нужны парсерные зависимости
# (bs4, PyYAML), которых нет в requirements.txt. Основной test.yml остаётся
# нетронутым и продолжает проверять tenders и funding как раньше.
#
# Прогоняются только тесты домена leads. Остальные engine/tests сюда не
# включены сознательно: в них есть падение, существовавшее до этого домена
# (engine/tests/test_pipeline.py::TestNicheTagger::test_no_match), и красный
# workflow создавал бы ложное впечатление, что его сломал модуль leads.

on:
  push:
    branches: [main, master]
    paths:
      - "leads/**"
      - "engine/**"
      - "config/leads_*"
      - "requirements-parser.txt"
      - ".github/workflows/test-leads.yml"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-parser.txt pytest

      - name: Run leads tests
        run: |
          pytest engine/tests/leads/ -v --tb=short
